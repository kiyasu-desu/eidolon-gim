name: 功能建议
description: 想要的新功能、新角色，或对现有行为的改进
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        动手前会先在 `.scratch/<feature>/` 写 spec 和 ticket；涉及已有设计决策的，请先看看 [docs/adr/](https://github.com/kiyasu-desu/eidolon-gim/tree/main/docs/adr)。

  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 现在用起来哪里不方便、缺了什么；用制作人或部署者的视角描述
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 设想的做法
      description: 希望它怎么表现；有参考的界面或原作场景可以附图
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他做法
      description: 不选它们的原因

  - type: input
    id: related-adr
    attributes:
      label: 相关的 ADR
      description: 会改变或依赖哪条 ADR，如 ADR-0002；没有就留空
