# 每周一检查一次依赖更新。小版本和补丁合成一个 PR；大版本各自单独开 PR，要看更新说明再合。
# 新版本发布满 7 天才提，避开刚发布就被撤回或被投毒的版本。
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # 类型的大版本跟着实际运行的 Node.js（22）走，和 Dockerfile 的 node 一起手动升
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # TypeScript 7 是 Go 重写的版本，还没有 JS API（scripts/stand-thumbnails.mts 用 ts.transpileModule），等它有了再手动升
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # Python、Node.js 的版本和 .python-version、pyproject.toml、模型流水线的要求一起手动升
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: node
        update-types: [version-update:semver-major]

  # docker-compose.prod.yml 里的 caddy、coturn
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      # 自己的镜像，由 CI 发布
      - dependency-name: ghcr.io/sallyn0225/*

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]
