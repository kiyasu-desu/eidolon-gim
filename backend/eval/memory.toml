# 记忆评测数据集（memory-upgrade：每项记忆改动的门槛）
#
# 用法：`eidolon eval memory [--json 结果.json]` 读这份文件，用部署者配置的背景模型、向量化、重排和判断模型，
# 按真实回合的路径逐题跑一遍，按题型打印通过数。每题用一个新的临时数据库和一位虚构的用户，
# 预置的记忆也通过记忆模块写入（每条在和来源角色的一个回合里写下），不碰部署的数据库。
# - [[extraction]] 提炼题：写好预置的记忆后，再进行一个回合（上文、制作人这句话、角色的回复），
#   看这一轮写下了什么。每题跑 3 次，每次都用新的临时库，过半通过才算通过；背景模型出错的那次算不通过。
# - [[recall]] 召回题：写好预置的记忆后，按对话中相同的方式问判断模型这一轮要不要找记忆，
#   要找就找（没有剧情、资料可查，只找记忆），看想起了哪些；同时打印判断模型的结论，
#   分清「判断没让找」和「找了没找到」。
# - 评测时的「今天」固定为 2026年10月8日（星期四，制作人在 Asia/Shanghai 时区），
#   预置的记忆也都是这一天记下的；「明天」就是 10月9日。
#
# 格式：
#
#   [[extraction]]
#   id = "supersede-moved-to-tokyo"   # 唯一，kebab-case，以题型开头
#   category = "supersede"             # 见下面的题型
#   character = "sora"                 # 这一轮对话的角色，characters.toml 里的角色 id
#   memories = [                       # 预置的记忆，可省略；按顺序写入
#     { key = "osaka", source = "temari", text = "制作人住在大阪" },
#     # superseded_by：已被哪条取代，那条要写在它后面；写下那条的回合会标出取代它
#     # （和真实回合一样，只能取代背景模型看到的最相关的 20 条有效记忆，没看到时评测报错）
#     { key = "old", source = "temari", text = "……", superseded_by = "new" },
#   ]
#   history = [                        # 上文，从旧到新；{ user = "…" } 或 { ja = "…", zh = "…" }（角色的回复）
#     { user = "最近好忙" },
#     { ja = "おつかれさまです", zh = "辛苦了" },
#   ]
#   said = "……"                        # 制作人这句话
#   reply = { ja = "……", zh = "……" }   # 角色对这句话的回复（日语原文和中文字幕）
#   must = [["东京", "東京"], "搬"]      # 每一项都要出现在某条新记忆里；一项可以是几个关键词的列表，出现任一个即可
#   must_not = ["累"]                   # 任何新记忆都不能出现的关键词
#   supersedes = ["osaka"]             # 这一轮之后必须变成被取代的预置记忆
#   keeps = ["cat"]                    # 这一轮之后必须仍然有效的预置记忆
#   nothing = true                     # 这一轮不该写下任何记忆（不能和 must、supersedes 同时写）
#   note = "为什么这样判；容易错在哪"
#   reviewed = false                   # 人工校对过改成 true
#
#   [[recall]]
#   id = "pronoun-cat-cried"
#   category = "pronoun"
#   character = "sora"
#   memories = [ … ]                   # 同上
#   history = [ … ]                    # 最后一条必须是角色的上一条回复；只有前情题可以写 []（对话刚开始）
#   said = "……"
#   found = ["cat"]                    # 必须想起的预置记忆
#   not_found = ["coffee"]             # 不许想起的预置记忆（found、not_found 至少写一个）
#   note = "…"
#   reviewed = false
#
# 题型（category）：
# - supersede（取代）：情况变了、说得更完整了，旧的记忆应被新的取代；两件事都成立时谁也不取代谁。
#   召回题里预置一对新旧记忆，旧的那条标 superseded_by，想起的应该只有新的。
# - duplicate（重复）：说的是已经记住的事（换个说法、对另一位角色说、很久以前说过），不该再写一条。
# - transient（短期状态）：当天就会过去的状态（累、困、饿、心情不好）不记；
#   会持续几天、朋友过后会问起的近况（生病、考试、面试、搬家、出差）要记。
# - pronoun（代词）：用户用「它」「她」「那边」指上一条回复里提到的东西，要能想起对应的记忆；
#   提炼题里写下的记忆要把代词换成具体的对象。
# - proper-noun（专有名词）：只出现过一次的宠物名、人名、店名，用户再提起时要能想起来；
#   提炼题里写下的记忆要保留这个名字。
# - continuity（前情）：打招呼、闲聊时该接上之前说过的事（「我回来了」→ 今天的面试）。
#   只作参考，用来决定以后要不要做常驻的制作人小档案，不作为任何改动的门槛。
#
# 门槛：一项改动针对的那一类题，通过数必须多于提交的基线；其他各类最多允许比基线少 1 个用例（前情类除外）。
# 每项改动完成后用真模型重跑，把结果以 JSON 更新到 memory-baseline.json（`--json eval/memory-baseline.json`），
# 并在对应 ticket 的 Comments 里记下对比。
#
# 基线（01）是在取代功能（ADR-0014）做好之前跑的：那时预置记忆的 superseded_by 不生效，提炼也不会取代
# 任何记忆，取代类题失败是预期的。
#
# 标注规则：
# - 关键词按「意思对了就该出现」来挑，留出同义的写法（「东京」「東京」）；不要求整句一致。
# - must_not 只写「写了就说明记错了」的词，例如当天的状态「累」；新记忆里写清「从大阪搬到东京」时
#   会出现「大阪」，这种词不放进 must_not。
# - 召回题的预置记忆里放几条相似但不相干的干扰项，用 not_found 检查它们没有被想起。
# - 期望结果有歧义的用例不放；收进来的边界情况在 note 里写清为什么这样判。
# - 用户说的话和角色的回复都是虚构的，只用到角色的名字和口吻，不含剧情原文（ADR-0003），可以提交。
# - 标注由 agent 起草，已人工审核（reviewed = true）；新加的用例先写 reviewed = false，人工校对后改成 true。

# ===========================================================================
# 取代（supersede）
# ===========================================================================

[[extraction]]
id = "supersede-moved-to-tokyo"
category = "supersede"
character = "temari"
memories = [
  { key = "osaka", source = "temari", text = "制作人住在大阪" },
  { key = "cat", source = "temari", text = "制作人养了一只叫小白的猫" },
]
history = [
  { user = "最近总算安顿下来了" },
  { ja = "えっと……何かあったんですか？", zh = "哇……发生什么事了吗？" },
]
said = "我上周末搬到东京了，离事务所近多了"
reply = { ja = "東京にお引っ越しされたんですね……！これからはもっと会えますね", zh = "您搬到东京了呀……！以后能更常见面了呢" }
must = [["东京", "東京"]]
supersedes = ["osaka"]
keeps = ["cat"]
note = "住处变了：大阪那条（对リク说的）应被取代，跨来源角色；猫和搬家无关，应保留。新记忆写成「从大阪搬到了东京」也对。"
reviewed = true

