# 学马生产环境（Linux VPS）：docker compose -f docker-compose.prod.yml up -d --build
# 从当前源码构建，不能拉上游 SC 镜像替代 GIM。部署步骤见 docs/deploy-gim.md。
# 所有密钥来自仓库根目录的 .env，不写进这个文件。
#
# 四个服务都用 host 网络：语音通话走 WebRTC（UDP），后端需要把本机的公网地址作为候选地址告诉浏览器，
# coturn 也需要直接收发 UDP。前端和后端只监听 127.0.0.1，公网上只开放 Caddy（80、443）和 coturn（3478 与中继端口）。

name: eidolon-gim

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    network_mode: host
    environment:
      EIDOLON_DOMAIN: ${EIDOLON_DOMAIN:?请在 .env 里填写 EIDOLON_DOMAIN}
      EIDOLON_FRONTEND_PORT: ${EIDOLON_FRONTEND_PORT:-3001}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # 证书
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped
    logging: *logging

  frontend:
    image: eidolon-gim-frontend:${EIDOLON_IMAGE_TAG:-local}
    pull_policy: build
    build: ./frontend
    network_mode: host
    environment:
      HOSTNAME: 127.0.0.1
      PORT: ${EIDOLON_FRONTEND_PORT:-3001}
      BACKEND_URL: http://127.0.0.1:${EIDOLON_BACKEND_PORT:-8001}
      # 写进 CSP：页面只许从这里另外加载立绘、缩略图和招呼
      EIDOLON_STAND_ASSETS_URL: ${EIDOLON_STAND_ASSETS_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  backend:
    image: eidolon-gim-backend:${EIDOLON_IMAGE_TAG:-local}
    pull_policy: build
    build: ./backend
    network_mode: host
    env_file: .env
    environment:
      HOST: 127.0.0.1
      PORT: ${EIDOLON_BACKEND_PORT:-8001}
      EIDOLON_DATABASE_PATH: /data/eidolon-gim.db
      EIDOLON_CHARACTERS_PATH: /characters/gim/characters.toml
      EIDOLON_LOCAL_SPEECH: ""
      # 浏览器和后端都用本机的 coturn 做 STUN；浏览器另外拿到 TURN 的临时凭据
      EIDOLON_ICE_SERVERS: ${EIDOLON_ICE_SERVERS:-stun:${EIDOLON_DOMAIN}:3478}
      EIDOLON_TURN_URLS: turn:${EIDOLON_DOMAIN}:3478?transport=udp,turn:${EIDOLON_DOMAIN}:3478?transport=tcp
      EIDOLON_TURN_SECRET: ${EIDOLON_TURN_SECRET:?请在 .env 里填写 EIDOLON_TURN_SECRET}
    volumes:
      - eidolon-data:/data # 数据库（用户、对话、记忆、剧情库）和同步下载的原始剧本缓存 /data/mirror
      - ./characters:/characters:ro # 人设、角色资料、头像
      - ./corpus:/corpus:ro # 可选本地模型与剧情包；容器内路径须在环境变量中显式配置
      - ./deploy:/deploy:ro # 运维脚本
    restart: unless-stopped
    logging: *logging
    stop_grace_period: 30s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['PORT'] + '/api/health', timeout=8)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  coturn:
    image: coturn/coturn:4.7
    network_mode: host
    # 直接运行 turnserver：镜像自带的入口脚本会对每个参数做一次 shell 求值
    entrypoint: ["turnserver"]
    command:
      - --listening-port=3478
      - --realm=${EIDOLON_DOMAIN}
      - --fingerprint
      # 和后端共用密钥：后端给每位用户签发会过期的凭据，密钥本身不出服务器
      - --use-auth-secret
      - --static-auth-secret=${EIDOLON_TURN_SECRET}
      - --min-port=${EIDOLON_TURN_MIN_PORT:-49160}
      - --max-port=${EIDOLON_TURN_MAX_PORT:-49259}
      # 只中继到本机（后端）：拒绝所有其他地址，免得被人拿来当开放的中继
      - --no-tcp-relay
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --allowed-peer-ip=${EIDOLON_PRIVATE_IP:-${EIDOLON_PUBLIC_IP}}
      # 公网地址不在网卡上（1:1 NAT 的云主机）时，告诉浏览器公网地址，本机用内网地址收发
      - --external-ip=${EIDOLON_PUBLIC_IP:?请在 .env 里填写 EIDOLON_PUBLIC_IP}/${EIDOLON_PRIVATE_IP:-${EIDOLON_PUBLIC_IP}}
      - --no-cli
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --simple-log
    restart: unless-stopped
    logging: *logging

volumes:
  eidolon-data:
  caddy-data:
  caddy-config:
